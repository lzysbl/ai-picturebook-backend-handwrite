<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找回密码 - AI 绘本故事生成系统</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page-wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge"></div>
        <div>
          <h1 class="brand-title">AI 绘本故事生成系统</h1>
          <p class="brand-sub">通过注册邮箱申请密码重置链接</p>
        </div>
      </div>
      <div class="link-row">
        <a href="/ui/login">返回登录</a>
      </div>
    </header>

    <main class="auth-layout">
      <section class="card auth-visual">
        <div>
          <h2 class="auth-heading">找回密码</h2>
          <p class="auth-text">
            输入注册邮箱后，系统会生成一次性重置链接。<br />
            开发演示环境会直接展示重置入口，方便论文演示。
          </p>
        </div>
      </section>

      <section class="card auth-form-card">
        <h2 class="section-title">申请重置链接</h2>
        <p class="section-sub">请填写注册时使用的邮箱</p>

        <form id="forgot-form" class="form">
          <div class="field">
            <label class="field-label" for="email">邮箱</label>
            <input id="email" class="input" type="email" maxlength="255" required />
          </div>
          <button class="btn btn-primary" type="submit">生成重置链接</button>
        </form>

        <div id="reset-result" class="note"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/ui-common.js"></script>
  <script src="/static/forgot-password.js"></script>
</body>
</html>
