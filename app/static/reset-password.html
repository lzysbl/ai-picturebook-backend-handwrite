<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重置密码 - AI 绘本故事生成系统</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page-wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge"></div>
        <div>
          <h1 class="brand-title">AI 绘本故事生成系统</h1>
          <p class="brand-sub">输入新密码，完成账号恢复</p>
        </div>
      </div>
      <div class="link-row">
        <a href="/ui/login">返回登录</a>
      </div>
    </header>

    <main class="auth-layout">
      <section class="card auth-visual">
        <div>
          <h2 class="auth-heading">重置密码</h2>
          <p class="auth-text">
            请输入一次性重置令牌和新密码。<br />
            如果你从演示链接进入，页面会自动填入令牌。
          </p>
        </div>
      </section>

      <section class="card auth-form-card">
        <h2 class="section-title">设置新密码</h2>
        <p class="section-sub">重置成功后请返回登录页重新登录</p>

        <form id="reset-form" class="form">
          <div class="field">
            <label class="field-label" for="token">重置令牌</label>
            <input id="token" class="input" type="text" maxlength="255" required />
          </div>
          <div class="field">
            <label class="field-label" for="password">新密码</label>
            <input id="password" class="input" type="password" minlength="6" maxlength="64" required />
          </div>
          <div class="field">
            <label class="field-label" for="confirm-password">确认新密码</label>
            <input id="confirm-password" class="input" type="password" minlength="6" maxlength="64" required />
          </div>
          <button class="btn btn-primary" type="submit">确认重置</button>
        </form>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/ui-common.js"></script>
  <script src="/static/reset-password.js"></script>
</body>
</html>
